<!DOCTYPE html>
<html lang="pt-BR">
<head>

<body>
    <h1>Inserindo vídeos hospedados localmente</h1>
    <p>Esta vídeo está hospedado no meu próprio servidor</p>

    <!--<video src="midia/Meu-Video-mp4.mp4" width="500" controls></video>  Essa é a forma sugerida pelo vsCode porém vamos fazer igual no audio, veja abaixo-->

    <video width="560" height="315" poster="imagens/capa-moto.png" controls loop >
        <source src="midia/Meu-Video-mp4.mp4" type="video/mp4">
        <source src="midia/Meu-Video-M4V.mkv" type="video/mp4">
        <source src="midia/Meu-Video-webm.webm" type="video/webm">
        <source src="midia/meu-video-ogv.ogv" type="video/ogg">
        <p>Seu navegador não tem compatibilidade de vídeos</p>
    </video> <!--De diferente o que fizemos foi colocar a capa com o atributo poster-->
    <!--Lembrando que a ordem tem influencia e lembrando que dessa forma consome muuuuuito trafego de dados(Consumo de bandas),  A melhor oção é usar videos, de serviços de hospedagens de vídeos-->

    <h1>Inserindo vídeos do YouTube</h1>
    <iframe width="560" height="315" src="https://www.youtube.com/embed/3hng-hmSv2Y?si=zhaG_WRPp_1pXo2f" title="YouTube video player" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe> 
    <!--Usando dessa forma vc não está consumindo dados do seu servidor esta consumindo dados do youtube, ou seja o idela é colocar o video do cliente também no you tube inclusive é o segundo maior buscador do mundo, caso vc queira bloquear o video para somente usuarios cadastrados veja vc tera que hospedar seu video em outra plataforma pois o youtube n aceita, PODEMOS SUGERIR O vimeo, no qual vc escolhe deixar o video publico ou privado(vimeo tem uma qualidade excepcional, porém o algoritmo dele não é tão bom) -->
