<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fontes Externas</title>
    <style>
        @font-face {
            font-family:'Flor' ;
            src: url(fontes/Floral\ Clover.otf) format('opentype');
            font-weight: normal;
            font-style: normal;
        }/*Trata-se de um seletor especial, que já monta a font-family e url, no final vamos adicionar um format() e parametrar ele com o formato do arquivo no nosso caso é otf(opentype), porém existem outros modelos, são eles:
        - opentype = otf
        - truetype = ttf
        - embedded-opentype
        - truetype-aat (aat = Apple Advanced Typography)
        - svg 
        Cada nevegador é compativel com um ou com outro tipo.
        Se quisermos outra url colocamos a , (virgula) url e format novamente.
        podemos adicionar dentro desse seletor especial a font-weight e font-style para explicitar que a fonte também funciona de tal maneira*/




        body {
            font-family: Arial, Helvetica, sans-serif;
        }
        h1{
            font-family: 'Flor', Times, serif;
            font-size: 3em;
            font-weight: normal;
        }
    </style>
</head>
<body>
    <h1>Título</h1>
    <p>Lorem ipsum dolor, sit amet consectetur adipisicing elit. Ut repudiandae numquam autem velit? Velit labore, minus atque facere eos delectus incidunt beatae possimus ut, culpa, rem obcaecati consectetur? Ipsa, tenetur.</p>
    
</body>
</html
