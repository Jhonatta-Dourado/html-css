<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modelo de caixas</title>
    <style>
        h1{ /*box-level, mas poderiamos transforma em box inline  com o display: inline;*/
            background-color: lightgreen;
            height: 300px;
            width: 300px;

            border-width: 10px; /*largura da borda*/
            border-style: solid ; /*tipo da borda*/
            border-color: darkslategray;

            /*Simplificando poderiamos usar boder: 10px solid darkslategray; diminuindo o codigo*/ 
            
            padding-top: 10px;
            padding-right: 10px;
            padding-bottom: 10px;
            padding-left: 10px;
            /*Simplificando poderiamos usar padding: 10px 10px 10px 10px; diminuindo o codigo o primeiro é em cima e gira em sentido horario, porem como os 4 valores são iguais poderiamos usar apenas padding: 10px; se caso colocarmos apenas 2 valores o de cima e o de baixo ficaram iguais e os laterais pegaram o segundo valor*/ 

            margin-top: 20px;
            margin-right: auto;
            margin-bottom: 40px;
            margin-left: auto;
            /* mesma coisa no margin, colocaremos so os valos cima, direita, baixo, esquerda  margin: 20px 20px 40px 20 px; caso eu quiser centralizar basta colocar no lugar do valor esquerda e direita o auto que ai ele centraliza*/

            outline-width: 5px;
            outline-style: dashed;
            outline-color: salmon; /*Linha tracejada que fica dentro da margem vamos usar 5px de margem*/
            /*Simplificando poderiamos usar boder: 5px dashed salmon; diminuindo o codigo*/ 


        }
        a{ /*inline-level mas poderiamos transforma em box level  com o display: block; ou até inline-block que ai permite mexer na altura e largura de um objeto inline*/
            border-width: 10px;
            border-style: solid;
            border-color: red;
             padding-top: 10px;
            padding-right: 10px;
            padding-bottom: 10px;
            padding-left: 10px;

           
        }
    </style>
</head>
<body>
    <h1>Exemplo de caixa box-level</h1>
    <p>parágrafos também são exemplos de box-level, mas os <a href="#">links são exemplos de caixas inline-level</a>. Vamos ver como tudo isso funciona.</p>
</body>
</html>
