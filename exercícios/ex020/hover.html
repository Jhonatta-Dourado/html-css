<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exemplo de hover</title>
    <style>
        body{
            font-family: Arial, Helvetica, sans-serif;
        }

        div > p {
            display: none; /*declarando para o display não mostrar nada*/

        } /*Aqui eu estou declarando que é um paragrafo que seja filho da div, que esteja dentro da div*/
        div:hover > p {
            display: block;
            color: white;
            background-color: red;
            width: 300px;

        } /*Estou declarando que quando eu passar o cursor em cima da divi o paragrafo que está dentro dela receberá uma declaração de display blok que significa mostrar o paragrafo, ele terá a cor branca um backgroud vermelho e uma largura de 300px */

        div:hover{
            color: red;
        }

    </style>
</head>
<body>
    <h1>Exemplo de hover</h1>
    <p>Passe o mouse sobre o texto abaixo</p>
    <div>
        Passe o mouse aqui
        <p>TEXTO ESCONDIDO...</p>

    </div>
    <p>Fim do exemplo</p>
    
</body>
</html>
