<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gradiente em CSS</title>
    <style>
        *{/*Configuração global em CSS*/
            height: 100%;
        }
        body{
            background-image: linear-gradient(to bottom, #73E2FC,#819396);
            background-attachment: fixed;
        } /*A formar de criar degrader em css no background é usando ela em imagem, seleciona o atributo interno linear-gradient, eai podemos escolher a direrçao do degradê to right, to lef, to top (porém aqui tem que fazer uma configuração global) e para baixo to bottom, lembrando que podemos adicionar quantas cores quisermos, e podemos ainda fazer em graus 45deg, 60deg, 02deg, dessa forma tudo junto, podemos escolher também a porcentagem de cada cor exemple blue 80%, gren 20%*/
    </style>
</head>
<body>
    <h1>Testando Gradiente</h1>
</body>
</html>
