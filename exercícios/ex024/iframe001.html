<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Estudos de iframe</title>
</head>
<body>
    <h1>Testando o uso de um iframe</h1>
    <p>
        Acessando o site do 
        
      <iframe src="https://www.cursoemvideo.com" frameborder="0" height="500">
        <a href="https://www.cursoemvideo.com" target="_blank">Curso em Vídeo</a>
      </iframe>
        
        para aprender a programar
    </p>

<!--O iframe é um quadro inline no qual podemos exibir páginas, vídeos e etc, tudo na mesma linha.-->

<p>
    O site do 
    
    <iframe src="https://www.google.com.br" frameborder="0">
        <a href="https://www.google.com.br" target="_blank">Google</a>     
    </iframe> 

    também é muito legal, pena que não funciona dentro do iframe!
</p>

<!--Existe alguns sites que possuem proteção para o seu conteúdo não ser exibido dentro de iframe, em sites de terceiros o google é um exemplo.-->

<!--Existem momentos e ocasiões que podemos usar iframe, porém, moderadamente, pois podem trazer problemas no lugar de soluções-->

<p>
    O repositório do Guanabara 

    <iframe src="https://gustavoguanabara.github.io" frameborder="0" height="500" width="500">
       no <a href="https://gustavoguanabara.github.io" target="_blank">GitHub</a>
    </iframe>

    também é bem legal!
</p>

<!--Alguns navegadores de celular não possuem suporte ao iframe, podemos adicionar mensagens entre a tag de abertura e a de fechamento e se o navegador não for compativel essa mensagem será ixibida, de forma inteligente podemos colocar nesse texto um link.-->

<!--Tamanho padrão do iframe é de 300x150 pixels, porém podemos ajustar o height e o width dentro da tag de abertura ou nas CSS que irão se sobrepor aos ajutes na própria tag -->
</body>
</html>
